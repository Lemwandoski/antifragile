<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Antifragile Launch Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232A3C9E'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="mark">ANTIFRAGILE</div>
      <h1>Launch Tracker</h1>
    </div>
    <div class="today" id="today"></div>
  </header>

  <section class="summary" id="summary" aria-label="Summary"></section>

  <div class="toolbar">
    <button class="btn primary" id="addBtn" type="button">+ New task</button>
    <input class="search" id="q" type="search" placeholder="Search tasks and comments" aria-label="Search">
    <select class="sel" id="catFilter" aria-label="Category"></select>
    <select class="sel" id="sortBy" aria-label="Sort">
      <option value="deadline" selected>Sort: deadline</option>
      <option value="priority">Sort: priority</option>
      <option value="recent">Sort: newest</option>
    </select>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="list" aria-pressed="true">List</button>
      <button type="button" data-view="board" aria-pressed="false">Board</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="chips" id="statusChips" role="group" aria-label="Filter by status"></div>
    <span class="spacer"></span>
    <div class="toolgroup">
      <button class="btn" id="exportBtn" type="button">Export</button>
      <button class="btn" id="importBtn" type="button">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>
  <div class="banner" id="banner" role="status" hidden></div>

  <main id="main"></main>
  <p class="note" id="storeNote"></p>
</div>

<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script src="js/app.js"></script>
</body>
</html>
